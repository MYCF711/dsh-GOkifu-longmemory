name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test "test/*.test.mjs"   # 只跑 test/ 的用例；tmp/ 里的旧实现副本不该进 CI
      - run: node scripts/check.mjs
